[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "financial-monte-carlo"
version = "0.1.0"
description = "Monte Carlo risk simulation engine for finance, cyber risk, and model validation"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["numpy>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov"]
notebook = ["jupyter>=1.0", "matplotlib>=3.8", "pandas>=2.0"]
app = ["streamlit>=1.35", "matplotlib>=3.8"]

[tool.hatch.build.targets.wheel]
packages = ["mc"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
omit = ["mc/__main__.py"]  # CLI entry point tested via subprocess — coverage.py can't instrument it
