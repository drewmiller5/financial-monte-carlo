[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "financial-monte-carlo"
version = "0.1.0"
description = "Monte Carlo risk simulation engine for finance, cyber risk, and model validation"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov"]

[tool.hatch.build.targets.wheel]
packages = ["mc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
